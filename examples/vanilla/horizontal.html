<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Horizontal Ticker (vanilla)</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<div class="acme-news-ticker">
    <div class="acme-news-ticker-label">Horizontal News</div>
    <div class="acme-news-ticker-box">
        <ul class="my-news-ticker">
            <li><a href="#">Test 1</a></li>
            <li><a href="#">Test 2</a></li>
            <li><a href="#">Test 3</a></li>
            <li><a href="#">Test 4</a></li>
            <li><a href="#">Test 5</a></li>
            <li><a href="#">Test 6</a></li>
            <li><a href="#">Test 7</a></li>
            <li><a href="#">Test 8</a></li>
        </ul>
    </div>
    <div class="acme-news-ticker-controls acme-news-ticker-horizontal-controls">
        <button class="acme-news-ticker-arrow acme-news-ticker-prev"></button>
        <button class="acme-news-ticker-pause"></button>
        <button class="acme-news-ticker-arrow acme-news-ticker-next"></button>
    </div>
</div>

<script type="module">
    import { AcmeTicker } from '../../dist/acmeticker.esm.js';

    document.querySelectorAll('.my-news-ticker').forEach((el) => {
        new AcmeTicker(el, {
            type: 'horizontal',
            direction: 'right',
            speed: 600,
            controls: {
                prev: '.acme-news-ticker-prev',
                next: '.acme-news-ticker-next',
                toggle: '.acme-news-ticker-pause'
            }
        });
    });
</script>
</body>
</html>
