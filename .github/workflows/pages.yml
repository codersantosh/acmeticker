name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Library & React Demo Bundles
        run: |
          npm run build
          npx esbuild examples/react/index.tsx --bundle --jsx=automatic --outfile=examples/react/bundle.js
          npx esbuild examples/react/rtl.tsx --bundle --jsx=automatic --outfile=examples/react/rtl.js

      - name: Assemble Pages Artifact (_site)
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp -r examples _site/examples
          cp -r dist _site/dist

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
